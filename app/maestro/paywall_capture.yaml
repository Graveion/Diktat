appId: com.graveion.diktat
---
# Capture the paywall with populated prices. Run app in forced-IAP + Test Store
# mode first: EXPO_PUBLIC_FORCE_IAP=1 EXPO_PUBLIC_RC_TEST_KEY=<test key> expo start --clear
- launchApp
- tapOn:
    text: "Don't Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Settings"
- waitForAnimationToEnd
- assertVisible:
    id: "manage-subscription"
- tapOn:
    id: "manage-subscription"
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: "/tmp/teal_paywall"
